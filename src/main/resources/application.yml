spring:
  application:
    name: ecommerce

  # PostgreSQL (docker-compose ile uyumlu)
  datasource:
    url: jdbc:postgresql://localhost:5433/ecommerce
    username: admin
    password: password
    driver-class-name: org.postgresql.Driver

  # JPA / Hibernate
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # Redis
  data:
    redis:
      host: localhost
      port: 6379

# JWT
# ------------------------------------------------
# jwt.secret: Token imzalamak icin kullanilan gizli anahtar.
#   En az 32 karakter (256 bit) olmali. Bu ornek deger yeterince uzun.
#   Uretim ortaminda environment variable ile gizlenmelidir.
#
# jwt.access-expiration-ms: Access Token suresi (milisaniye)
#   900000 ms = 15 dakika
#
# jwt.refresh-expiration-ms: Refresh Token suresi (milisaniye)
#   604800000 ms = 7 gun
# ------------------------------------------------
jwt:
  secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
  access-expiration-ms: 900000
  refresh-expiration-ms: 604800000

# Swagger UI
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# Server
server:
  port: 8080

# E-Commerce Custom Settings
ecommerce:
  discount:
    active-strategy: PERCENTAGE # NO_DISCOUNT | PERCENTAGE | FIXED_AMOUNT
    percentage-rate: 0.10       # %10 indirim
    fixed-amount: 50.00         # 50.00 TL indirim

# Actuator & Metrics (Prometheus)
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}


